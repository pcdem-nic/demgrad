        function App() {
            const [searchId, setSearchId] = useState('');
            const [activeStudentId, setActiveStudentId] = useState(null);
            const [activeTab, setActiveTab] = useState('graduation'); // 'graduation', 'subjects', 'internship'
            
            // App settings state
            const [config, setConfig] = useState(() => {
                const saved = localStorage.getItem('nic_portal_config');
                return saved ? JSON.parse(saved) : DEFAULT_CONFIG;
            });
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);

            // Loaded Data States
            const [loading, setLoading] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');
            const [lastRefreshed, setLastRefreshed] = useState(null);

            // Data stores
            const [studentsData, setStudentsData] = useState([]);
            const [subjectsData, setSubjectsData] = useState([]);
            const [internshipsData, setInternshipsData] = useState([]);

            // Mobile menu state
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

            // Save configuration update
            const saveConfig = (newConfig) => {
                setConfig(newConfig);
                localStorage.setItem('nic_portal_config', JSON.stringify(newConfig));
            };

            const buildCsvUrl = (sheetName, customUrl) => {
                if (customUrl && customUrl.trim() !== '') return customUrl.trim();
                return `https://docs.google.com/spreadsheets/d/${config.spreadsheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
            };

            const fetchSheetCsv = (url) => {
                return new Promise((resolve, reject) => {
                    Papa.parse(url, {
                        download: true,
                        header: true,
                        skipEmptyLines: true,
                        complete: (results) => {
                            // Standardize column key naming
                            const cleaned = results.data.map(row => {
                                const newRow = {};
                                Object.keys(row).forEach(key => {
                                    const cleanKey = key.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
                                    newRow[cleanKey] = row[key] ? row[key].trim() : '';
                                });
                                return newRow;
                            });
                            resolve(cleaned);
                        },
                        error: (err) => reject(err)
                    });
                });
            };

            const loadPortalData = async () => {
                setLoading(true);
                setErrorMsg('');

                if (config.useMockData) {
                    setTimeout(() => {
                        setStudentsData(MOCK_DATA.students);
                        setSubjectsData(MOCK_DATA.subjects);
                        setInternshipsData(MOCK_DATA.internships);
                        setLastRefreshed(new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
                        setLoading(false);
                    }, 400);
                    return;
                }

                try {
                    const studentUrl = buildCsvUrl(config.sheetStudents, config.customStudentUrl);
                    const subjectUrl = buildCsvUrl(config.sheetSubjects, config.customSubjectUrl);
                    const internshipUrl = buildCsvUrl(config.sheetInternships, config.customInternshipUrl);

                    const [rawStudents, rawSubjects, rawInternships] = await Promise.all([
                        fetchSheetCsv(studentUrl),
                        fetchSheetCsv(subjectUrl),
                        fetchSheetCsv(internshipUrl)
                    ]);

                    // Map students
                    const mappedStudents = rawStudents.map(r => ({
                        studentId: r.studentid || r.id || '',
                        studentName: r.studentname || r.name || '',
                        programme: r.programme || r.program || '',
                        graduationStatus: r.graduationstatus || ''
                    })).filter(s => s.studentId);

                    // Map subjects
                    const mappedSubjects = rawSubjects.map(r => ({
                        studentId: r.studentid || r.id || '',
                        subjectCode: r.subjectcode || r.code || '',
                        subjectName: r.subjectname || r.name || '',
                        semester: r.semester || '',
                        status: r.status || 'Pending',
                        actionLink: r.actionlink || r.link || r.url || ''
                    })).filter(s => s.studentId);

                    // Map internships
                    const mappedInternships = rawInternships.map(r => ({
                        studentId: r.studentid || r.id || '',
                        documentType: r.documenttype || r.type || '',
                        submissionStatus: r.submissionstatus || r.submitted || '',
                        verificationStatus: r.verificationstatus || r.verification || '',
                        submissionDate: r.submissiondate || r.date || '',
                        fileLink: r.filelink || r.link || r.file || r.url || ''
                    })).filter(i => i.studentId);

                    setStudentsData(mappedStudents);
                    setSubjectsData(mappedSubjects);
                    setInternshipsData(mappedInternships);
                    setLastRefreshed(new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
                } catch (err) {
                    console.error("Google Sheet Fetch Error:", err);
                    setErrorMsg("Unable to retrieve information from Google Sheets. Please check your internet connection or Spreadsheet ID configuration.");
                } finally {
                    setLoading(false);
                }
            };

            // Initial load
            useEffect(() => {
                loadPortalData();
            }, [config.useMockData, config.spreadsheetId]);

            // Active Student Data Filtering
            const currentStudent = useMemo(() => {
                if (!activeStudentId) return null;
                return studentsData.find(s => s.studentId.trim().toUpperCase() === activeStudentId.trim().toUpperCase());
            }, [studentsData, activeStudentId]);

            const studentSubjects = useMemo(() => {
                if (!activeStudentId) return [];
                return subjectsData.filter(s => s.studentId.trim().toUpperCase() === activeStudentId.trim().toUpperCase());
            }, [subjectsData, activeStudentId]);

            const studentPendingSubjects = useMemo(() => {
                return studentSubjects.filter(s => {
                    const st = (s.status || '').toLowerCase();
                    return st === 'pending' || st === 'incomplete' || st === 'failed';
                });
            }, [studentSubjects]);

            const studentInternships = useMemo(() => {
                if (!activeStudentId) return [];
                return internshipsData.filter(i => i.studentId.trim().toUpperCase() === activeStudentId.trim().toUpperCase());
            }, [internshipsData, activeStudentId]);

            const requiredDocs = ['Internship Logbook', 'Internship Report', 'Presentation Slides', 'Video Presentation'];

            const internshipDocStatusMap = useMemo(() => {
                const map = {};
                requiredDocs.forEach(docType => {
                    const record = studentInternships.find(i => 
                        (i.documentType || '').toLowerCase().includes(docType.toLowerCase()) ||
                        docType.toLowerCase().includes((i.documentType || '').toLowerCase())
                    );
                    
                    if (record) {
                        const subStatus = (record.submissionStatus || '').trim();
                        const verStatus = (record.verificationStatus || '').trim();
                        
                        let isComplete = false;
                        if (config.completionRule === 'SUBMITTED') {
                            isComplete = subStatus.toLowerCase() === 'submitted';
                        } else {
                            // APPROVED rule
                            isComplete = verStatus.toLowerCase() === 'approved';
                        }

                        map[docType] = {
                            found: true,
                            record,
                            submissionStatus: subStatus || 'Not Submitted',
                            verificationStatus: verStatus || '—',
                            submissionDate: record.submissionDate || '—',
                            fileLink: record.fileLink || '',
                            isComplete
                        };
                    } else {
                        map[docType] = {
                            found: false,
                            record: null,
                            submissionStatus: 'Not Submitted',
                            verificationStatus: '—',
                            submissionDate: '—',
                            fileLink: '',
                            isComplete: false
                        };
                    }
                });
                return map;
            }, [studentInternships, config.completionRule]);

            const completedInternshipCount = useMemo(() => {
                return requiredDocs.reduce((count, docType) => {
                    return count + (internshipDocStatusMap[docType] && internshipDocStatusMap[docType].isComplete ? 1 : 0);
                }, 0);
            }, [internshipDocStatusMap]);

            // Overall Eligibility Calculation
            const eligibilityResult = useMemo(() => {
                if (!currentStudent) return null;

                const pendingSubjectCount = studentPendingSubjects.length;
                const internshipComplete = completedInternshipCount === 4;

                const isEligible = (pendingSubjectCount === 0) && internshipComplete;

                const reasons = [];
                if (pendingSubjectCount > 0) {
                    reasons.push(`${pendingSubjectCount} pending/incomplete academic subject${pendingSubjectCount > 1 ? 's' : ''}`);
                }

                if (!internshipComplete) {
                    const missingDocs = requiredDocs.filter(d => !(internshipDocStatusMap[d] && internshipDocStatusMap[d].isComplete));
                    if (config.completionRule === 'APPROVED') {
                        reasons.push(`${missingDocs.length} internship document${missingDocs.length > 1 ? 's' : ''} pending approval or submission (${missingDocs.join(', ')})`);
                    } else {
                        reasons.push(`${missingDocs.length} internship document${missingDocs.length > 1 ? 's' : ''} not yet submitted (${missingDocs.join(', ')})`);
                    }
                }

                return {
                    isEligible,
                    reasons,
                    pendingSubjectCount,
                    completedInternshipCount
                };
            }, [currentStudent, studentPendingSubjects, completedInternshipCount, internshipDocStatusMap, config.completionRule]);

            // Handle Search Submit
            const handleSearch = (e) => {
                if (e && e.preventDefault) e.preventDefault();
                if (!searchId.trim()) return;
                
                const cleanId = searchId.trim().toUpperCase();
                setActiveStudentId(cleanId);
                setActiveTab('graduation');
            };

            const handleClearStudent = () => {
                setActiveStudentId(null);
                setSearchId('');
            };

            return (
                <div className="min-h-screen flex flex-col justify-between bg-slate-50">
                    {/* Header Bar */}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between items-center h-20">
                                {/* Brand Logo & Name */}
                                <div className="flex items-center space-x-3 cursor-pointer" onClick={handleClearStudent}>
                                    <div className="w-12 h-12 rounded-xl bg-maroon-gradient flex items-center justify-center text-white shadow-md shadow-maroon-200">
                                        <i className="fa-solid fa-graduation-cap text-2xl"></i>
                                    </div>
                                    <div>
                                        <span className="text-xl font-extrabold text-slate-900 tracking-tight block leading-tight">
                                            NEWTON
                                        </span>
                                        <span className="text-xs font-semibold text-maroon-600 tracking-widest uppercase block">
                                            International College
                                        </span>
                                    </div>
                                </div>

                                {/* Desktop Navigation */}
                                {activeStudentId && (
                                    <nav className="hidden md:flex space-x-1 bg-slate-100 p-1.5 rounded-xl border border-slate-200">
                                        <button
                                            onClick={() => setActiveTab('graduation')}
                                            className={`px-4 py-2 rounded-lg text-sm font-semibold transition-all duration-150 flex items-center space-x-2 ${
                                                activeTab === 'graduation'
                                                    ? 'bg-white text-maroon-700 shadow-sm'
                                                    : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200/50'
                                            }`}
                                        >
                                            <i className="fa-solid fa-award"></i>
                                            <span>Graduation Status</span>
                                        </button>
                                        <button
                                            onClick={() => setActiveTab('subjects')}
                                            className={`px-4 py-2 rounded-lg text-sm font-semibold transition-all duration-150 flex items-center space-x-2 ${
                                                activeTab === 'subjects'
                                                    ? 'bg-white text-maroon-700 shadow-sm'
                                                    : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200/50'
                                            }`}
                                        >
                                            <i className="fa-solid fa-book"></i>
                                            <span>Pending Subjects</span>
                                            {studentPendingSubjects.length > 0 && (
                                                <span className="ml-1 px-2 py-0.5 text-xs font-bold bg-amber-100 text-amber-800 rounded-full">
                                                    {studentPendingSubjects.length}
                                                </span>
                                            )}
                                        </button>
                                        <button
                                            onClick={() => setActiveTab('internship')}
                                            className={`no-print px-4 py-2 rounded-lg text-sm font-semibold transition-all duration-150 flex items-center space-x-2 ${
                                                activeTab === 'internship'
                                                    ? 'bg-white text-maroon-700 shadow-sm'
                                                    : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200/50'
                                            }`}
                                        >
                                            <i className="fa-solid fa-file-contract"></i>
                                            <span>Internship Submissions</span>
                                        </button>
                                    </nav>
                                )}

                                {/* Top Right Actions */}
                                    
                                <div className="flex items-center space-x-3">
                                    {activeStudentId && (
                                        <button
                                            onClick={handleClearStudent}
                                            className="hidden sm:inline-flex items-center px-3.5 py-2 border border-slate-300 rounded-xl text-xs font-semibold text-slate-700 bg-white hover:bg-slate-50 transition shadow-sm"
                                        >
                                            <i className="fa-solid fa-user-gear mr-2 text-slate-400"></i>
                                            Change Student ID
                                        </button>
                                    )}

                                    <button
                                        onClick={() => setIsSettingsOpen(true)}
                                        className="p-2.5 rounded-xl border border-slate-200 text-slate-600 hover:text-maroon-600 hover:border-maroon-300 bg-white transition shadow-sm"
                                        title="Portal Data Settings & Rules"
                                    >
                                        <i className="fa-solid fa-sliders text-lg"></i>
                                    </button>

                                    {/* Mobile Menu Button */}
                                    {activeStudentId && (

                                                                </td>
                                                                <td className="py-4 px-4">
                                                                    <span className="px-2.5 py-1 rounded-lg text-xs font-bold bg-amber-100 text-amber-800">
                                                                        {subject.status}
                                                                    </span>
                                                                </td>
                                                                <td className="py-4 px-4 text-right">
                                                                    {subject.actionLink ? (
                                                                        <a
                                                                            href={subject.actionLink}
                                                                            target="_blank"
                                                                            rel="noopener noreferrer"
                                                                            className="inline-flex items-center space-x-1 px-3 py-1.5 bg-slate-900 hover:bg-maroon-600 text-white font-semibold rounded-lg text-xs transition"
                                                                        >
                                                                            <span>Action Link</span>
                                                                            <i className="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                                                                        </a>
                                                                    ) : (
                                                                        <span className="text-xs text-slate-400 italic">Link Unavailable</span>
                                                                    )}
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>

                                                {/* Mobile Card View */}
                                                <div className="space-y-3 md:hidden">
                                                    {studentPendingSubjects.map((subject) => (
                                                        <div key={subject.subjectCode} className="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-3">
                                                            <div className="flex justify-between items-start">
                                                                <span className="font-mono font-bold text-maroon-600 text-sm">{subject.subjectCode}</span>
                                                                <span className="px-2 py-0.5 rounded text-xs font-bold bg-amber-100 text-amber-800">
                                                                    {subject.status}
                                                                </span>
                                                            </div>
                                                            <div>
                                                                <h4 className="font-bold text-slate-900 text-base">{subject.subjectName}</h4>
                                                                <p className="text-xs text-slate-500">{subject.semester}</p>
                                                            </div>
                                                            <div className="pt-2 border-t border-slate-200/60 flex justify-end">
                                                                {subject.actionLink ? (
                                                                    <a
                                                                        href={subject.actionLink}
                                                                        target="_blank"
                                                                        rel="noopener noreferrer"
                                                                        className="no-print px-4 py-2 bg-slate-900 text-white font-semibold rounded-xl text-xs flex items-center space-x-1"
                                                                    >
                                                                        <span>Action Link</span>
                                                                        <i className="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                                                                    </a>
                                                                ) : (
                                                                    <span className="text-xs text-slate-400 italic">Link Unavailable</span>
                                                                )}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {}
                                {/* TAB 3: SEPARATE INTERNSHIP SUBMISSIONS PAGE */}
                                {activeTab === 'internship' && (
                                    <div className="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-md space-y-6">
                                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-100">
                                            <div>
                                                <h2 className="text-2xl font-bold text-slate-900">Internship Document Submissions</h2>
                                                <p className="text-xs text-slate-500 mt-0.5">
                                                    Manage required practical documentation for Student ID: <strong className="text-slate-700">{activeStudentId}</strong>
                                                </p>
                                            </div>

                                            {/* Internship Progress Summary Box */}
                                            <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200 flex items-center space-x-4">
                                                <div className="text-right">
                                                    <span className="text-[10px] uppercase font-bold text-slate-400 block">Overall Status</span>
                                                    <span className="text-sm font-bold text-slate-900">{completedInternshipCount} / 4 Completed</span>
                                                </div>
                                                <div className="w-10 h-10 rounded-xl bg-maroon-gradient text-white flex items-center justify-center font-bold text-sm shadow-sm">
                                                    {Math.round((completedInternshipCount / 4) * 100)}%
                                                </div>
                                            </div>
                                        </div>

                                        {/* Internship 4 Cards Grid */}
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
                                            {requiredDocs.map((docType, index) => {
                                                const item = internshipDocStatusMap[docType];
                                                const isSubmitted = item && item.submissionStatus && item.submissionStatus.toLowerCase() === 'submitted';
                                                const isApproved = item && item.verificationStatus && item.verificationStatus.toLowerCase() === 'approved';
                                                
                                                // Dynamic forms config link selection
                                                let formUrl = config.formLogbook;
                                                if (docType.includes('Report')) formUrl = config.formReport;
                                                if (docType.includes('Slides')) formUrl = config.formSlides;
                                                if (docType.includes('Video')) formUrl = config.formVideo;

                                                return (
                                                    <div key={docType} className="bg-slate-50/70 hover:bg-slate-50 rounded-2xl p-6 border border-slate-200 transition flex flex-col justify-between">
                                                        <div>
                                                            <div className="flex justify-between items-start mb-3">
                                                                <span className="text-xs font-mono font-extrabold text-maroon-600 bg-maroon-50 px-2.5 py-1 rounded-lg border border-maroon-100">
                                                                    0{index + 1}
                                                                </span>
                                                                <div className="flex flex-wrap gap-1 justify-end">
                                                                    {isSubmitted ? (
                                                                        <span className="px-2.5 py-0.5 bg-emerald-100 text-emerald-800 rounded-md text-xs font-bold flex items-center">
                                                                            <i className="fa-solid fa-check mr-1"></i> Submitted
                                                                        </span>
                                                                    ) : (
                                                                        <span className="px-2.5 py-0.5 bg-amber-100 text-amber-800 rounded-md text-xs font-bold flex items-center">
                                                                            <i className="fa-solid fa-triangle-exclamation mr-1"></i> Not Submitted
                                                                        </span>
                                                                    )}

                                                                    <span className={`px-2.5 py-0.5 rounded-md text-xs font-bold ${
                                                                        isApproved 
                                                                            ? 'bg-emerald-600 text-white' 
                                                                            : (item && item.verificationStatus && item.verificationStatus.toLowerCase().includes('revision'))
                                                                            ? 'bg-rose-100 text-rose-800'
                                                                            : 'bg-slate-200 text-slate-700'
                                                                    }`}>
                                                                        {(item && item.verificationStatus) || '—'}
                                                                    </span>
                                                                </div>
                                                            </div>

                                                            <h3 className="text-lg font-bold text-slate-900 mb-2">
                                                                {docType}
                                                            </h3>

                                                            <div className="space-y-1.5 text-xs text-slate-600 mb-6 bg-white p-3 rounded-xl border border-slate-100">
                                                                <div className="flex justify-between">
                                                                    <span className="text-slate-400">Submission Date:</span>
                                                                    <span className="font-semibold text-slate-700">{(item && item.submissionDate) || '—'}</span>
                                                                </div>
                                                                <div className="flex justify-between">
                                                                    <span className="text-slate-400">Verification:</span>
                                                                    <span className="font-semibold text-slate-700">{(item && item.verificationStatus) || 'Pending'}</span>
                                                                </div>
                                                            </div>
                                                        </div>

                                                        {/* Dynamic Submission or File Link Action */}
                                                        <div className="no-print">
                                                            {isSubmitted && item && item.fileLink ? (
                                                                <a
                                                                    href={item.fileLink}
                                                                    target="_blank"
                                                                    rel="noopener noreferrer"
                                                                    className="w-full py-2.5 px-4 bg-slate-900 hover:bg-slate-800 text-white font-semibold rounded-xl text-xs transition flex items-center justify-center space-x-2"
                                                                >
                                                                    <i className="fa-solid fa-external-link text-xs"></i>
                                                                    <span>{docType.includes('Video') ? 'Watch Video Link' : 'View Submitted Document'}</span>
                                                                </a>
                                                            ) : (
                                                                <a
                                                                    href={formUrl}
                                                                    target="_blank"
                                                                    rel="noopener noreferrer"
                                                                    className="w-full py-2.5 px-4 bg-maroon-gradient hover:opacity-95 text-white font-bold rounded-xl text-xs transition flex items-center justify-center space-x-2 shadow-sm"
                                                                >
                                                                    <i className="fa-solid fa-cloud-arrow-up"></i>
                                                                    <span>Submit {docType.replace('Internship ', '')}</span>
                                                                </a>
                                                            )}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>

                                        {/* Read-Only Notice Box */}
                                        <div className="bg-slate-100 border border-slate-200 rounded-2xl p-4 text-slate-600 text-xs flex items-center space-x-3">
                                            <i className="fa-solid fa-shield-halved text-maroon-600 text-xl shrink-0"></i>
                                            <div>
                                                <p className="font-semibold text-slate-800">Secure Institutional Submission Portal</p>
                                                <p className="mt-0.5">
                                                    Submissions are processed via secure college forms. Verification status is updated on your status dashboard once verified by the Academic & Internship Office.
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-white border-t border-slate-200 mt-12 py-6">
                        <div className="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500 space-y-2">
                            <div className="flex justify-center items-center space-x-2 font-bold text-slate-700">
                                <span>Newton International College</span>
                                <span>•</span>
                                <span className="text-maroon-600">Graduation & Academic Affairs Office</span>
                            </div>
                            <p>© 2026 Newton International College. All rights reserved.</p>
                        </div>
                    </footer>

                    {}
                    {/* Settings Modal */}
                    {isSettingsOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fadeIn">
                            <div className="bg-white rounded-3xl max-w-2xl w-full p-6 sm:p-8 shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto space-y-6">
                                <div className="flex justify-between items-center pb-4 border-b border-slate-100">
                                    <div className="flex items-center space-x-3">
                                        <div className="w-10 h-10 rounded-xl bg-maroon-50 text-maroon-600 flex items-center justify-center font-bold">
                                            <i className="fa-solid fa-sliders text-lg"></i>
                                        </div>
                                        <div>
                                            <h3 className="text-xl font-bold text-slate-900">Portal Configuration</h3>
                                            <p className="text-xs text-slate-500">Configure Google Sheets integration & graduation rules</p>
                                        </div>
                                    </div>
                                    <button
                                        onClick={() => setIsSettingsOpen(false)}
                                        className="text-slate-400 hover:text-slate-600 p-2 rounded-lg"
                                    >
                                        <i className="fa-solid fa-xmark text-xl"></i>
                                    </button>
                                </div>

                                {/* Dataset Switch: Demo vs Published Google Sheets */}
                                <div className="p-4 bg-slate-50 rounded-2xl border border-slate-200">
                                    <label className="flex items-center justify-between cursor-pointer">
                                        <div>
                                            <span className="font-bold text-slate-900 text-sm block">Use Interactive Demo Dataset</span>
                                            <span className="text-xs text-slate-500 block">Switch to pre-populated sample records for instant testing</span>
                                        </div>
                                        <input
                                            type="checkbox"
                                            checked={config.useMockData}
                                            onChange={(e) => saveConfig({ ...config, useMockData: e.target.checked })}
                                            className="w-5 h-5 text-maroon-600 focus:ring-maroon-500 rounded cursor-pointer"
                                        />
                                    </label>
                                </div>

                                {/* Graduation Eligibility Rule Toggle */}
                                <div className="space-y-2">
                                    <label className="text-xs font-bold text-slate-700 uppercase tracking-wider block">
                                        Internship Graduation Completion Rule
                                    </label>
                                    <div className="grid grid-cols-2 gap-3">
                                        <button
                                            type="button"
                                            onClick={() => saveConfig({ ...config, completionRule: 'SUBMITTED' })}
                                            className={`p-3.5 rounded-xl border text-left text-xs transition ${
                                                config.completionRule === 'SUBMITTED'
                                                    ? 'bg-maroon-50 border-maroon-500 text-maroon-900 font-bold'
                                                    : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'
                                            }`}
                                        >
                                            <div className="font-bold text-sm mb-0.5">Option A: Submitted = Complete</div>
                                            <p className="text-[11px] opacity-80">Document marked complete immediately upon student submission.</p>
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => saveConfig({ ...config, completionRule: 'APPROVED' })}
                                            className={`p-3.5 rounded-xl border text-left text-xs transition ${
                                                config.completionRule === 'APPROVED'
                                                    ? 'bg-maroon-50 border-maroon-500 text-maroon-900 font-bold'
                                                    : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'
                                            }`}
                                        >
                                            <div className="font-bold text-sm mb-0.5">Option B: Approved = Complete</div>
                                            <p className="text-[11px] opacity-80">Requires verification status to be 'Approved' by college staff.</p>
                                        </button>
                                    </div>
                                </div>

                                {/* Google Sheets Parameters */}
                                {!config.useMockData && (
                                    <div className="space-y-4 pt-2 border-t border-slate-100">
                                        <h4 className="font-bold text-slate-900 text-sm">Google Sheets Published Endpoint Settings</h4>
                                        <div>
                                            <label className="text-xs font-semibold text-slate-700 block mb-1">Spreadsheet ID</label>
                                            <input
                                                type="text"
                                                value={config.spreadsheetId}
                                                onChange={(e) => saveConfig({ ...config, spreadsheetId: e.target.value })}
                                                placeholder="e.g. 1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms"
                                                className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-mono"
                                            />
                                            <p className="text-[11px] text-slate-400 mt-1">
                                                Spreadsheet must be published to web via File &gt; Share &gt; Publish to web.
                                            </p>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                            <div>
                                                <label className="text-xs font-semibold text-slate-700 block mb-1">Sheet 1 (Students)</label>
                                                <input
                                                    type="text"
                                                    value={config.sheetStudents}
                                                    onChange={(e) => saveConfig({ ...config, sheetStudents: e.target.value })}
                                                    className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs"
                                                />
                                            </div>
                                            <div>
                                                <label className="text-xs font-semibold text-slate-700 block mb-1">Sheet 2 (Subjects)</label>
                                                <input
                                                    type="text"
                                                    value={config.sheetSubjects}
                                                    onChange={(e) => saveConfig({ ...config, sheetSubjects: e.target.value })}
                                                    className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs"
                                                />
                                            </div>
                                            <div>
                                                <label className="text-xs font-semibold text-slate-700 block mb-1">Sheet 3 (Internship)</label>
                                                <input
                                                    type="text"
                                                    value={config.sheetInternships}
                                                    onChange={(e) => saveConfig({ ...config, sheetInternships: e.target.value })}
                                                    className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs"
                                                />
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* Instructions on Publishing Google Sheets */}
                                <div className="p-4 bg-slate-50 rounded-2xl border border-slate-200 text-xs text-slate-600 space-y-2">
                                    <h5 className="font-bold text-slate-800 flex items-center">
                                        <i className="fa-solid fa-circle-info text-maroon-600 mr-2"></i>
                                        How to Publish Your Google Sheet
                                    </h5>
                                    <ol className="list-decimal list-inside space-y-1 text-slate-600">
                                        <li>In Google Sheets, go to <strong className="text-slate-800">File &gt; Share &gt; Publish to web</strong>.</li>
                                        <li>Select <strong className="text-slate-800">Entire Document</strong> or individual sheets and choose <strong className="text-slate-800">Comma-separated values (.csv)</strong>.</li>
                                        <li>Ensure sheet tab names match Sheet 1: <code className="bg-slate-200 px-1 py-0.5 rounded">Students</code>, Sheet 2: <code className="bg-slate-200 px-1 py-0.5 rounded">Academic Subjects</code>, Sheet 3: <code className="bg-slate-200 px-1 py-0.5 rounded">Internship Documents</code>.</li>
                                    </ol>
                                </div>

                                <div className="pt-4 border-t border-slate-100 flex justify-end space-x-3">
                                    <button
                                        onClick={() => {
                                            saveConfig(DEFAULT_CONFIG);
                                            loadPortalData();
                                        }}
                                        className="px-4 py-2.5 border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold rounded-xl text-xs transition"
                                    >
                                        Reset Defaults
                                    </button>
                                    <button
                                        onClick={() => {
                                            setIsSettingsOpen(false);
                                            loadPortalData();
                                        }}
                                        className="px-5 py-2.5 bg-maroon-gradient hover:opacity-95 text-white font-bold rounded-xl text-xs transition shadow-md"
                                    >
                                        Save & Apply Settings
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
